<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>MEDECAR BIENVENIDOS</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:black;
    overflow:hidden;
}

/* LINEAS */
.linea1{
    height:20px;
    background:#5896E2;
    animation: crecer 2s ease-in-out;
}

.linea2{
    height:20px;
    background:#43FFB6;
    animation: crecer 2s ease-in-out;
}

/* ANIMACION TEXTO */
.titulo{
    animation: aparecer 2s ease-in-out;
}

@keyframes aparecer{
    from{opacity:0; transform: translateY(-20px);}
    to{opacity:1; transform: translateY(0);}
}

@keyframes crecer{
    from{width:0;}
    to{width:100%;}
}

</style>

</head>

<body class="text-white">

<div class="container text-center vh-100 d-flex flex-column justify-content-center">

    <h1 class="display-3 mb-5 titulo">BIENVENIDOS 🚗</h1>

    <div class="row mb-5">
        <div class="col">
            <div class="linea1"></div>
        </div>
        <div class="col">
            <div class="linea2"></div>
        </div>
    </div>

    <h2 class="mb-5">Cargando sistema...</h2>

</div>

<!-- REDIRECCIÓN AUTOMÁTICA -->
<script>
    setTimeout(function(){
        window.location.href = "principal.html";
    }, 3000); // 3000 ms = 3 segundos
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
